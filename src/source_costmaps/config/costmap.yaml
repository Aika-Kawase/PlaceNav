local_costmap:
  global_frame: odom
  robot_base_frame: base_link
  update_frequency: 5.0 # 10.0
  publish_frequency: 2.0 # 5.0
  transform_tolerance: 0.5 # 0.5
  rolling_window: true
  static_map: false
  width: 6.0 # 12.0
  height: 6.0 # 12.0
  resolution: 0.05 # 0.05
  track_unknown_space: false
  always_send_full_costmap: true
  footprint: [[-0.15, -0.30], [-0.15, 0.30], [0.85, 0.30], [0.85, -0.30]] # [[-0.15, -0.30], [-0.15, 0.30], [0.85, 0.30], [0.85, -0.30]]
  footprint_padding: 0.02 # 0.02
  plugins:
    - {name: d435, type: "spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer"}
    - {name: unik3d, type: "spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer"}
    - {name: inflation, type: "costmap_2d::InflationLayer"}

  d435:
    enabled: true
    voxel_decay: 8.0 # 0.8
    decay_model: 0 # 0
    voxel_size: 0.05 # 0.05
    track_unknown_space: false
    mark_threshold: 0 # 1
    max_obstacle_height: 2.0
    origin_z: 0.0
    update_footprint_enabled: true
    combination_method: 1 # 1
    publish_voxel_map: true
    transform_tolerance: 0.5 # 0.2
    mapping_mode: false
    observation_sources: cloud
    cloud:
      data_type: PointCloud2
      topic: /obstacles/d435/points
      # Points are in odom; ranging origin must remain the physical camera.
      sensor_frame: realsense_color_optical_frame
      obstacle_range: 1.0 # 3.0
      marking: true
      clearing: false
      expected_update_rate: 0.0 # 0.5
      observation_persistence: 0.0 # 0.0
      clear_after_reading: true
      # Height/range/downsampling were applied by the acquisition-time gate.
      filter: none

  unik3d:
    enabled: true
    voxel_decay: 8.0 # 0.4
    decay_model: 0 # 0
    voxel_size: 0.05 # 0.10
    track_unknown_space: false
    mark_threshold: 0 # 1
    max_obstacle_height: 2.0
    origin_z: 0.0
    update_footprint_enabled: true
    combination_method: 1 # 1
    publish_voxel_map: true
    transform_tolerance: 0.5 # 0.2
    mapping_mode: false
    observation_sources: cloud
    cloud:
      data_type: PointCloud2
      topic: /obstacles/unik3d/points
      sensor_frame: c2_corrected_camera_optical_frame
      obstacle_range: 1.0 # 6.0
      marking: true
      clearing: false
      expected_update_rate: 0.0 # 1.0
      observation_persistence: 0.0 # 0.0
      clear_after_reading: true
      filter: none

  inflation:
    enabled: true
    inflation_radius: 0.70 # 0.70
    cost_scaling_factor: 3.0 # 3.0
    inflate_unknown: false
