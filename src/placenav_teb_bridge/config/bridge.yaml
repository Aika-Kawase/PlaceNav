path_topic: /placenav/gnm_path
cmd_vel_topic: /cmd_vel
controller_frequency: 5.0
plan_position_epsilon: 0.02
plan_orientation_epsilon: 0.02

# These values are for PC integration tests. Measure the WHILL footprint and
# create an explicit real-robot configuration before commanding the vehicle.
footprint: [[-0.25, -0.20], [-0.25, 0.20], [0.25, 0.20], [0.25, -0.20]]
footprint_padding: 0.02

local_costmap:
  global_frame: odom
  robot_base_frame: base_link
  update_frequency: 5.0
  publish_frequency: 2.0
  transform_tolerance: 0.5
  rolling_window: true
  width: 6.0
  height: 6.0
  resolution: 0.05
  static_map: false
  track_unknown_space: false

  plugins:
    - {name: stvl, type: "spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer"}
    - {name: inflation, type: "costmap_2d::InflationLayer"}

  stvl:
    enabled: true
    voxel_decay: 3.0
    decay_model: 0
    voxel_size: 0.05
    track_unknown_space: false
    max_obstacle_height: 2.0
    mark_threshold: 0
    update_footprint_enabled: true
    combination_method: 1
    obstacle_range: 3.0
    origin_z: 0.0
    publish_voxel_map: true
    transform_tolerance: 0.5
    mapping_mode: false
    observation_sources: depth_cloud

    depth_cloud:
      data_type: PointCloud2
      topic: /stvl_test_points
      marking: true
      clearing: false
      min_obstacle_height: 0.1
      max_obstacle_height: 1.5
      expected_update_rate: 0.0
      observation_persistence: 0.0
      inf_is_valid: false
      clear_after_reading: true
      filter: passthrough

  inflation:
    enabled: true
    inflation_radius: 0.45
    cost_scaling_factor: 3.0

TebLocalPlannerROS:
  odom_topic: /odom
  map_frame: odom

  teb_autosize: true
  dt_ref: 0.3
  dt_hysteresis: 0.1
  max_samples: 100
  global_plan_overwrite_orientation: false
  allow_init_with_backwards_motion: false
  max_global_plan_lookahead_dist: 5.0
  global_plan_viapoint_sep: 0.3
  global_plan_prune_distance: 0.5
  exact_arc_length: false
  feasibility_check_no_poses: 5
  publish_feedback: false

  max_vel_x: 0.4
  max_vel_x_backwards: 0.1
  max_vel_y: 0.0
  max_vel_theta: 0.4
  acc_lim_x: 0.3
  acc_lim_theta: 0.4
  min_turning_radius: 0.0

  footprint_model:
    type: polygon
    vertices: [[-0.25, -0.20], [-0.25, 0.20], [0.25, 0.20], [0.25, -0.20]]

  xy_goal_tolerance: 0.2
  yaw_goal_tolerance: 0.2
  free_goal_vel: false
  complete_global_plan: true

  min_obstacle_dist: 0.1
  inflation_dist: 0.45
  include_costmap_obstacles: true
  costmap_obstacles_behind_robot_dist: 1.0
  obstacle_poses_affected: 15
  include_dynamic_obstacles: false

  no_inner_iterations: 5
  no_outer_iterations: 4
  optimization_activate: true
  optimization_verbose: false
  penalty_epsilon: 0.05
  weight_max_vel_x: 2
  weight_max_vel_theta: 1
  weight_acc_lim_x: 1
  weight_acc_lim_theta: 1
  weight_kinematics_nh: 1000
  weight_kinematics_forward_drive: 10
  weight_kinematics_turning_radius: 1
  weight_optimaltime: 1
  weight_shortest_path: 0
  weight_obstacle: 100
  weight_inflation: 0.2
  # Keep the GNM route as guidance, but allow local detours around obstacles.
  weight_viapoint: 8
  weight_adapt_factor: 2

  enable_homotopy_class_planning: true
  enable_multithreading: true
  max_number_classes: 3
  selection_cost_hysteresis: 0.8
  selection_prefer_initial_plan: 0.2
  selection_obst_cost_scale: 100.0
  viapoints_all_candidates: false
  switching_blocking_period: 3.0
  roadmap_graph_no_samples: 25
  roadmap_graph_area_width: 4.0

  shrink_horizon_backup: true
  oscillation_recovery: true
